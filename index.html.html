<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>윈코 업무 도구</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --paper:#F5F7F6; --surface:#ffffff; --ink:#17231e; --sub:#607069;
    --line:#dce3df; --teal:#0e6e58; --teal-soft:#e3f0eb; --order:#b7791f; --order-soft:#fff6e6;
    --shadow:0 1px 2px rgba(25,36,31,.05), 0 10px 28px rgba(25,36,31,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(circle at 8% 0%,rgba(14,110,88,.08),transparent 30%),radial-gradient(circle at 100% 16%,rgba(183,121,31,.08),transparent 26%),var(--paper); color:var(--ink);
    font-family:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .screen{position:fixed; inset:0; display:flex; flex-direction:column;
    transition:opacity .28s ease, transform .28s ease;}
  #home{overflow-y:auto; z-index:1;}
  #viewer{opacity:0; transform:translateX(14px); pointer-events:none;
    background:var(--paper); z-index:2; visibility:hidden;}
  body.in-viewer #home{opacity:0; transform:translateX(-14px); pointer-events:none; visibility:hidden;}
  body.in-viewer #viewer{opacity:1; transform:none; pointer-events:auto; visibility:visible;}
  @media (prefers-reduced-motion:reduce){.screen{transition:none;}}

  .home-wrap{max-width:1040px; width:100%; margin:0 auto; padding:34px 24px 56px;}
  .brand{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
  .wordmark{font-size:13px; font-weight:800; letter-spacing:.16em; color:var(--teal); text-transform:uppercase;}
  .date{font-size:12.5px; font-weight:600; color:var(--sub); font-variant-numeric:tabular-nums;}
  h1.lead{font-size:30px; font-weight:800; letter-spacing:-.025em; margin:6px 0 0;}
  .lead .pin{position:relative; white-space:nowrap;}
  .lead .pin::after{content:""; position:absolute; left:-1px; right:-1px; bottom:3px; height:9px;
    background:var(--teal-soft); z-index:-1; border-radius:3px;}
  .sublead{font-size:14px; color:var(--sub); font-weight:500; margin:10px 0 22px; max-width:620px;}

  .toolbar{display:flex; align-items:center; gap:10px; margin:0 0 28px;}
  .search-wrap{position:relative; flex:1; max-width:480px;}
  .search-wrap::before{content:"⌕"; position:absolute; left:14px; top:50%; transform:translateY(-52%); color:var(--sub); font-size:22px; pointer-events:none;}
  .tool-search{width:100%; border:1px solid var(--line); background:rgba(255,255,255,.88); color:var(--ink); font:inherit; font-size:14px; font-weight:600; padding:12px 42px; border-radius:13px; box-shadow:0 4px 18px rgba(25,36,31,.04); outline:none;}
  .tool-search:focus{border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,110,88,.12); background:#fff;}
  .search-clear{position:absolute; right:9px; top:50%; transform:translateY(-50%); width:28px; height:28px; border:0; border-radius:8px; background:transparent; color:var(--sub); font:inherit; font-size:18px; cursor:pointer; display:none;}
  .search-clear.show{display:block;}.search-clear:hover{background:#edf2ef;color:var(--ink);}
  .shortcut{font-size:11.5px; font-weight:700; color:#7b8982; white-space:nowrap;}

  .tool-section{margin-top:27px;}
  .tool-section:first-of-type{margin-top:0;}
  .section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:11px; padding:0 2px;}
  .section-title{display:flex; align-items:center; gap:9px; margin:0; font-size:19px; font-weight:850; letter-spacing:-.02em;}
  .section-title::before{content:""; width:9px; height:9px; border-radius:50%; background:var(--section-ac); box-shadow:0 0 0 5px color-mix(in srgb,var(--section-ac) 13%,transparent);}
  .section-copy{font-size:12px; color:var(--sub); font-weight:600; margin:0;}
  .section-count{display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:21px; padding:0 7px; border-radius:99px; background:color-mix(in srgb,var(--section-ac) 11%,#fff); color:var(--section-ac); font-size:11px; font-weight:800;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:13px;}
  .tool-section.cs .grid{grid-template-columns:repeat(3,1fr);}
  .card[hidden]{display:none;}
  .empty-search{display:none; background:#fff; border:1px dashed #cbd6d0; border-radius:16px; padding:28px; text-align:center; color:var(--sub); font-size:13px; font-weight:600;}
  .empty-search.show{display:block;}
  .recent{position:absolute; top:12px; right:12px; display:none; align-items:center; gap:4px; padding:3px 7px; border-radius:99px; background:#eef6f2; color:var(--teal); font-size:10px; font-weight:800;}
  .card.is-recent .recent{display:inline-flex;}
  @media (max-width:800px){.tool-section.cs .grid{grid-template-columns:1fr 1fr;}.tool-section.cs .card:last-child{grid-column:1/-1;}}
  @media (max-width:620px){
    .home-wrap{padding:24px 16px 44px;} h1.lead{font-size:27px;}.toolbar{align-items:stretch;}.shortcut{display:none;}
    .grid,.tool-section.cs .grid{grid-template-columns:1fr;}.tool-section.cs .card:last-child{grid-column:auto;}
    .section-copy{display:none;}.card{min-height:0!important;padding:16px;}.chip{width:42px!important;height:42px!important;font-size:20px!important;}
  }

  .card{position:relative; display:flex; align-items:flex-start; gap:14px; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    min-height:132px; padding:18px 18px 16px; cursor:pointer; font:inherit; color:inherit; box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    border-left:4px solid var(--ac);}
  .card:hover{transform:translateY(-3px); box-shadow:0 4px 10px rgba(25,36,31,.07), 0 18px 36px rgba(25,36,31,.10); border-color:color-mix(in srgb, var(--ac) 45%, var(--line));}
  .card:focus-visible{outline:2.5px solid var(--ac); outline-offset:3px;}
  .card:active{transform:translateY(-1px);}
  .chip{flex:none; width:46px; height:46px; border-radius:12px; display:grid; place-items:center;
    font-size:22px; font-weight:800; line-height:1;
    background:color-mix(in srgb, var(--ac) 13%, #fff); color:var(--ac);}
  .c-body{flex:1; min-width:0; display:flex; flex-direction:column;}
  .c-tag{font-size:11px; font-weight:800; letter-spacing:.07em; color:var(--ac);
    text-transform:uppercase; margin-bottom:3px;}
  .c-name{font-size:17px; font-weight:800; letter-spacing:-.01em;}
  .c-desc{font-size:12.8px; color:var(--sub); font-weight:500; margin-top:5px; line-height:1.5;}
  .c-go{position:absolute; right:16px; bottom:14px; font-size:12px; font-weight:800; color:var(--ac);
    opacity:0; transform:translateX(-4px); transition:.15s;}
  .card:hover .c-go{opacity:1; transform:none;}
  @media (hover:none){.c-go{opacity:.75; transform:none;}}

  .home-foot{margin-top:30px; font-size:11.5px; color:#9a968b; text-align:center; line-height:1.7;}

  .vbar{flex:none; display:flex; align-items:center; gap:12px; padding:11px 16px;
    padding-top:calc(11px + env(safe-area-inset-top));
    background:rgba(244,242,236,.92); backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--line); position:relative; z-index:3;}
  .back{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font:inherit; font-size:13.5px; font-weight:800; padding:8px 14px 8px 11px;
    border-radius:10px; cursor:pointer; transition:.13s;}
  .back:hover{border-color:var(--vac,var(--teal)); color:var(--vac,var(--teal));}
  .back:focus-visible{outline:2px solid var(--vac,var(--teal)); outline-offset:2px;}
  .back:active{transform:scale(.97);}
  .vtitle{display:flex; align-items:center; gap:9px; font-size:15px; font-weight:800; letter-spacing:-.01em; min-width:0;}
  .vtitle .vico{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; font-size:15px;
    background:color-mix(in srgb, var(--vac,#0e6e58) 14%, #fff); color:var(--vac,#0e6e58);}
  .vtitle .vname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .frame-host{flex:1; position:relative; background:var(--paper);}
  .frame-host iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--paper);}
</style>
<style>
  /* 2026 home refresh */
  :root{
    --paper:#f3f6f5;
    --surface:#ffffff;
    --ink:#15211d;
    --sub:#64716c;
    --line:#dfe6e3;
    --teal:#0a6b56;
    --teal-soft:#e8f3ef;
    --shadow:0 18px 50px rgba(25,48,40,.07);
  }

  body{
    background:
      radial-gradient(circle at 8% -8%,rgba(14,110,88,.10),transparent 34%),
      radial-gradient(circle at 96% 3%,rgba(183,121,31,.08),transparent 28%),
      var(--paper);
  }

  .home-wrap{
    max-width:1160px;
    padding:48px 28px 64px;
  }

  .brand{
    align-items:center;
    margin-bottom:22px;
  }

  .wordmark{
    display:inline-flex;
    align-items:center;
    min-height:30px;
    padding:0 12px;
    border:1px solid rgba(10,107,86,.16);
    border-radius:999px;
    background:rgba(255,255,255,.72);
    box-shadow:0 6px 18px rgba(25,48,40,.04);
    letter-spacing:.13em;
  }

  .date{
    padding:7px 11px;
    border-radius:10px;
    background:rgba(255,255,255,.62);
  }

  h1.lead{
    max-width:760px;
    margin:0;
    font-size:clamp(34px,4.4vw,50px);
    line-height:1.13;
    letter-spacing:-.045em;
  }

  .lead .pin::after{
    left:-3px;
    right:-3px;
    bottom:4px;
    height:14px;
    background:#cce7dd;
    border-radius:5px;
  }

  .sublead{
    max-width:680px;
    margin:15px 0 28px;
    font-size:15px;
    line-height:1.7;
  }

  .toolbar{
    gap:14px;
    margin-bottom:34px;
  }

  .search-wrap{max-width:680px;}

  .tool-search{
    min-height:54px;
    padding:14px 48px;
    border-color:#d8e1dd;
    border-radius:16px;
    background:#fff;
    font-size:15px;
    box-shadow:0 12px 32px rgba(25,48,40,.06);
  }

  .search-wrap::before{
    left:17px;
    color:var(--teal);
    font-size:24px;
  }

  .search-clear{right:12px;}

  .shortcut{
    padding:8px 11px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(255,255,255,.64);
  }

  .tool-section{
    margin-top:18px;
    padding:24px;
    border:1px solid rgba(214,225,220,.9);
    border-radius:24px;
    background:rgba(255,255,255,.78);
    box-shadow:var(--shadow);
    backdrop-filter:blur(10px);
  }

  .tool-section:first-of-type{margin-top:0;}

  .section-head{
    align-items:center;
    margin-bottom:17px;
    padding:0 2px;
  }

  .section-title{
    gap:11px;
    font-size:20px;
  }

  .section-title::before{
    width:10px;
    height:10px;
    box-shadow:0 0 0 6px color-mix(in srgb,var(--section-ac) 12%,transparent);
  }

  .section-copy{font-size:12.5px;}

  .section-count{
    min-width:27px;
    height:23px;
    font-size:11.5px;
  }

  .grid{gap:14px;}
  .tool-section.cs .grid{grid-template-columns:repeat(2,1fr);}

  .card{
    min-height:154px;
    padding:20px;
    border:1px solid #e1e7e4;
    border-left:1px solid #e1e7e4;
    border-radius:18px;
    box-shadow:none;
    overflow:hidden;
  }

  .card::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:3px;
    background:var(--ac);
    opacity:.78;
    transform:scaleX(.28);
    transform-origin:left;
    transition:transform .2s ease;
  }

  .card:hover{
    transform:translateY(-3px);
    border-color:color-mix(in srgb,var(--ac) 30%,#dfe6e3);
    box-shadow:0 16px 34px rgba(25,48,40,.09);
  }

  .card:hover::after{transform:scaleX(1);}

  .chip{
    width:48px;
    height:48px;
    border-radius:14px;
    font-size:22px;
  }

  .c-tag{
    margin-bottom:4px;
    font-size:10.5px;
  }

  .c-name{
    font-size:18px;
    letter-spacing:-.02em;
  }

  .c-desc{
    max-width:42ch;
    margin-top:7px;
    color:#69766f;
    font-size:13px;
  }

  .c-go{
    right:18px;
    bottom:16px;
  }

  .recent{
    top:14px;
    right:14px;
    padding:4px 8px;
    border:1px solid #d8eae3;
    background:#f1f8f5;
  }

  .home-foot{
    margin-top:24px;
    color:#8a9891;
  }

  .postit-widget{position:fixed;right:18px;bottom:18px;z-index:90;width:min(360px,calc(100vw - 28px));min-width:280px;font-family:inherit;}
  .postit-panel{position:relative;overflow:hidden;border:1px solid #e4cf8d;border-radius:18px;background:#fffdf5;box-shadow:0 22px 60px rgba(35,45,39,.2),0 3px 12px rgba(35,45,39,.09);}
  .postit-widget.has-custom-size .postit-panel{display:flex;height:100%;min-height:180px;flex-direction:column;}
  .postit-head{display:flex;flex:0 0 auto;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:10px 11px 10px 16px;border-bottom:1px solid rgba(132,102,26,.14);background:linear-gradient(135deg,#ffecab,#ffe393);cursor:grab;touch-action:none;user-select:none;}
  .postit-head.is-dragging{cursor:grabbing;}
  .postit-heading{display:flex;align-items:baseline;gap:7px;min-width:0;}
  .postit-heading strong{color:#463b22;font-size:14px;font-weight:850;letter-spacing:-.02em;}
  .postit-count{color:#8b7440;font-size:11px;font-weight:750;}
  .postit-actions{display:flex;align-items:center;gap:6px;}
  .postit-button{min-height:34px;border:1px solid rgba(102,79,22,.18);border-radius:9px;background:rgba(255,255,255,.72);color:#5d4b22;font:inherit;font-size:12px;font-weight:800;cursor:pointer;}
  .postit-button:hover{background:#fff;}
  .postit-add{padding:0 11px;}
  .postit-collapse{width:34px;padding:0;font-size:19px;line-height:1;}
  .postit-list{display:flex;max-height:min(52vh,470px);flex:1 1 auto;min-height:0;flex-direction:column;gap:9px;overflow:auto;padding:12px;}
  .postit-widget.has-custom-size .postit-list{max-height:none;}
  .postit-empty{padding:25px 14px;border:1px dashed #dfcf9f;border-radius:12px;color:#8b805f;font-size:12.5px;text-align:center;}
  .postit-note{position:relative;flex:0 0 auto;min-height:92px;border:1px solid rgba(139,107,25,.16);border-radius:12px;background:#fff2ae;box-shadow:0 5px 13px rgba(82,67,29,.07);}
  .postit-note:nth-child(3n+2){border-color:rgba(46,115,76,.13);background:#e8f5e9;}
  .postit-note:nth-child(3n){border-color:rgba(55,96,141,.13);background:#eaf2fb;}
  .postit-text{display:block;width:100%;height:100%;min-height:90px;resize:none;border:0;outline:0;background:transparent;padding:15px 40px 15px 13px;color:#3e3a2e;font:inherit;font-size:13.5px;line-height:1.55;}
  .postit-text::placeholder{color:#9a8e69;}
  .postit-note-grip{position:absolute;left:50%;z-index:3;width:48px;height:12px;transform:translateX(-50%);border:0;background:transparent;cursor:ns-resize;touch-action:none;}
  .postit-note-grip::after{content:"";display:block;width:28px;height:3px;margin:auto;border-radius:99px;background:rgba(100,79,29,.22);}
  .postit-note-grip:hover::after{background:rgba(77,58,17,.52);}
  .postit-note-grip.top{top:0;}
  .postit-note-grip.bottom{bottom:0;}
  .postit-delete{position:absolute;top:7px;right:7px;width:27px;height:27px;border:0;border-radius:8px;background:rgba(255,255,255,.62);color:#8e7654;font:inherit;font-size:17px;cursor:pointer;}
  .postit-delete:hover{background:#fff;color:#a33a32;}
  .postit-foot{flex:0 0 auto;padding:0 29px 10px 13px;color:#9b8b61;font-size:10.5px;text-align:right;}
  .postit-resize{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border:0;background:transparent;color:#9c824b;font:inherit;font-size:16px;line-height:1;cursor:nwse-resize;touch-action:none;}
  .postit-resize::after{content:"◢";display:block;transform:scale(.85);transform-origin:center;}
  .postit-open{display:none;align-items:center;gap:8px;margin-left:auto;min-height:46px;padding:0 15px;border:1px solid #dfca87;border-radius:14px;background:linear-gradient(135deg,#ffedae,#ffe293);box-shadow:0 12px 32px rgba(35,45,39,.17);color:#493c20;font:inherit;font-size:13px;font-weight:850;cursor:pointer;}
  .postit-badge{display:grid;min-width:21px;height:21px;place-items:center;border-radius:99px;background:#6e5926;color:#fff;font-size:10.5px;}
  .postit-widget.is-collapsed .postit-panel{display:none;}
  .postit-widget.is-collapsed .postit-open{display:flex;}
  .postit-widget.is-collapsed{width:auto!important;height:auto!important;min-width:0;}

  @media (max-width:800px){
    .home-wrap{padding-top:34px;}
    .tool-section.cs .card:last-child{grid-column:auto;}
    .tool-section.cs .grid{grid-template-columns:1fr;}
    .grid{grid-template-columns:1fr;}
    .card{min-height:138px;}
  }

  @media (max-width:620px){
    .home-wrap{padding:24px 14px 42px;}
    .brand{margin-bottom:18px;}
    .date{font-size:11.5px;}
    h1.lead{font-size:34px;}
    .sublead{margin:12px 0 22px;font-size:14px;}
    .toolbar{margin-bottom:26px;}
    .tool-search{min-height:52px;}
    .tool-section{padding:18px 14px;border-radius:20px;}
    .section-head{margin-bottom:14px;}
    .section-title{font-size:18px;}
    .card{padding:17px 16px;border-radius:16px;}
    .recent{position:static;order:3;margin-left:auto;align-self:flex-start;}
    .c-go{display:none;}
    .postit-widget{right:10px;bottom:10px;width:calc(100vw - 20px);}
    .postit-list{max-height:42vh;}
  }
</style>
</head>
<body class="">

  <main id="home" class="screen">
    <div class="home-wrap">
      <div class="brand">
        <span class="wordmark">윈코 운영팀</span>
        <span class="date" id="today">2026년 7월 24일 (금)</span>
      </div>
      <h1 class="lead">오늘 업무를 <span class="pin">더 빠르게</span></h1>
      <p class="sublead">발주와 CS 업무를 구분해 필요한 도구를 바로 찾을 수 있습니다.</p>

      <div class="toolbar" role="search">
        <div class="search-wrap">
          <input class="tool-search" id="toolSearch" type="search" placeholder="도구 이름이나 업무로 검색" aria-label="업무 도구 검색" autocomplete="off">
          <button class="search-clear" id="searchClear" type="button" aria-label="검색어 지우기">×</button>
        </div>
        <span class="shortcut">단축키 / 로 검색</span>
      </div>

      <section class="tool-section order" style="--section-ac:#b7791f" aria-labelledby="orderTitle">
        <div class="section-head">
          <div><h2 class="section-title" id="orderTitle">발주 <span class="section-count">2</span></h2></div>
          <p class="section-copy">발주 진행과 업체 단가를 확인합니다</p>
        </div>
        <div class="grid">
      <button class="card is-recent" data-mod="order" style="--ac:#0F766E">
        <span class="recent">최근 사용</span>
        <span class="chip" aria-hidden="true">✓</span>
        <span class="c-body">
          <span class="c-tag">데일리 진행</span>
          <span class="c-name">발주 체크리스트</span>
          <span class="c-desc">오늘 할 발주 작업을 시간 순서대로 체크하고 진행률을 확인합니다.</span>
        </span>
        <span class="c-go" aria-hidden="true">열기 →</span>
      </button>
      <button class="card" data-mod="vendor" style="--ac:#b7791f">
        <span class="recent">최근 사용</span>
        <span class="chip" aria-hidden="true">₩</span>
        <span class="c-body">

<script>

const MODULES = JSON.parse(document.getElementById("mod-data").textContent);
const byId = Object.fromEntries(MODULES.map(m => [m.id, m]));

const now = new Date();
const days = ["일","월","화","수","목","금","토"];
document.getElementById("today").textContent =
  now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 ("+days[now.getDay()]+")";

const body      = document.body;
const frameHost = document.getElementById("frameHost");
const vName     = document.getElementById("vName");
const vIco      = document.getElementById("vIco");
const viewer    = document.getElementById("viewer");

const POSTIT_KEY = "winco_postit_notes_v1";
const POSTIT_COLLAPSE_KEY = "winco_postit_collapsed_v1";
const POSTIT_LAYOUT_KEY = "winco_postit_layout_v1";
const postitWidget = document.getElementById("postitWidget");
const postitPanel = document.getElementById("postitPanel");
const postitHead = postitPanel.querySelector(".postit-head");
const postitList = document.getElementById("postitList");
const postitCount = document.getElementById("postitCount");
const postitCollapsedCount = document.getElementById("postitCollapsedCount");
const postitSaveState = document.getElementById("postitSaveState");
const postitOpenBtn = document.getElementById("postitOpenBtn");
const postitSizeBtn = document.getElementById("postitSizeBtn");
const postitResize = document.getElementById("postitResize");
let postitNotes = [];
let postitSaveTimer = null;
let postitLayout = null;

try{
  const savedPostits = localStorage.getItem(POSTIT_KEY);
  const parsedPostits = savedPostits === null ? [] : JSON.parse(savedPostits);
  if(Array.isArray(parsedPostits)){
    postitNotes = parsedPostits.filter(function(note){
      return note && typeof note.id === "string" && typeof note.text === "string";
    });
  }
}catch(e){}

try{
  const savedLayout = JSON.parse(localStorage.getItem(POSTIT_LAYOUT_KEY) || "null");
  if(savedLayout && typeof savedLayout === "object") postitLayout = savedLayout;
}catch(e){}

function postitId(){
  return "note-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
}

function updatePostitCount(){
  postitCount.textContent = postitNotes.length + "개";
  postitCollapsedCount.textContent = postitNotes.length;
}

function savePostits(){
  if(postitSaveTimer){
    clearTimeout(postitSaveTimer);
    postitSaveTimer = null;
  }
  try{
    localStorage.setItem(POSTIT_KEY, JSON.stringify(postitNotes));
    postitSaveState.textContent = "자동 저장됨";
  }catch(e){
    postitSaveState.textContent = "저장 공간을 확인해 주세요";
  }
}

function queuePostitSave(){
  postitSaveState.textContent = "저장 중…";
  clearTimeout(postitSaveTimer);
  postitSaveTimer = setTimeout(savePostits, 300);
}

function renderPostits(focusId){
  postitList.innerHTML = "";
  if(postitNotes.length === 0){
    const empty = document.createElement("div");
    empty.className = "postit-empty";
    empty.textContent = "메모가 없습니다. 위의 ‘+ 추가’를 눌러 시작하세요.";
    postitList.appendChild(empty);
  }else{
    postitNotes.forEach(function(note){
      const card = document.createElement("div");
      card.className = "postit-note";
      if(Number.isFinite(note.height)){
        card.style.height = clampPostit(note.height, 92, 520) + "px";
      }

      const field = document.createElement("textarea");
      field.className = "postit-text";
      field.value = note.text;
      field.placeholder = "메모를 입력하세요…";
      field.setAttribute("aria-label", "업무 메모");
      field.dataset.noteId = note.id;

      const remove = document.createElement("button");
      remove.className = "postit-delete";
      remove.type = "button";
      remove.textContent = "×";
      remove.title = "메모 삭제";
      remove.setAttribute("aria-label", "메모 삭제");
      remove.dataset.deleteNote = note.id;

      const topGrip = document.createElement("button");
      topGrip.className = "postit-note-grip top";
      topGrip.type = "button";
      topGrip.dataset.noteResize = "top";
      topGrip.dataset.noteId = note.id;
      topGrip.setAttribute("aria-label", "메모 위쪽 높이 조절");
      topGrip.title = "위아래로 드래그하여 높이 조절";

      const bottomGrip = document.createElement("button");
      bottomGrip.className = "postit-note-grip bottom";
      bottomGrip.type = "button";
      bottomGrip.dataset.noteResize = "bottom";
      bottomGrip.dataset.noteId = note.id;
      bottomGrip.setAttribute("aria-label", "메모 아래쪽 높이 조절");
      bottomGrip.title = "위아래로 드래그하여 높이 조절";

      card.appendChild(field);
      card.appendChild(remove);
      card.appendChild(topGrip);
      card.appendChild(bottomGrip);
      postitList.appendChild(card);
    });
  }
  updatePostitCount();
  if(focusId){
    const target = postitList.querySelector('[data-note-id="'+focusId+'"]');
    if(target){
      target.focus();
      target.scrollIntoView({block:"nearest"});
    }
  }
}

function setPostitCollapsed(collapsed, persist){
  postitWidget.classList.toggle("is-collapsed", collapsed);
  postitOpenBtn.setAttribute("aria-expanded", String(!collapsed));
  if(!collapsed && postitLayout) requestAnimationFrame(function(){ applyPostitLayout(postitLayout); });
  if(persist !== false){
    try{ localStorage.setItem(POSTIT_COLLAPSE_KEY, collapsed ? "1" : "0"); }catch(e){}
  }
}

function clampPostit(value, min, max){
  return Math.min(Math.max(value, min), Math.max(min, max));
}

function setPostitSizeButton(large){
  postitSizeBtn.textContent = large ? "작게" : "크게";
  postitSizeBtn.setAttribute("aria-pressed", String(!!large));
}

function applyPostitLayout(layout){
  if(!layout || postitWidget.classList.contains("is-collapsed")) return;
  postitWidget.classList.remove("has-custom-size");
  postitWidget.style.left = "";
  postitWidget.style.top = "";
  postitWidget.style.right = "";
  postitWidget.style.bottom = "";
  postitWidget.style.width = "";
  postitWidget.style.height = "";

  const gap = window.innerWidth <= 620 ? 10 : 18;
  const maxWidth = Math.max(260, window.innerWidth - gap * 2);
  const maxHeight = Math.max(180, window.innerHeight - gap * 2);
  const custom = Number.isFinite(layout.width) && Number.isFinite(layout.height);

  if(custom){
    const width = clampPostit(layout.width, Math.min(280,maxWidth), maxWidth);
    const height = clampPostit(layout.height, 180, maxHeight);
    const left = clampPostit(Number(layout.left) || gap, gap, window.innerWidth - width - gap);
    const top = clampPostit(Number(layout.top) || gap, gap, window.innerHeight - height - gap);
    postitWidget.classList.add("has-custom-size");
    postitWidget.style.left = left + "px";
    postitWidget.style.top = top + "px";
    postitWidget.style.right = "auto";
    postitWidget.style.bottom = "auto";
    postitWidget.style.width = width + "px";
    postitWidget.style.height = height + "px";
  }else if(Number.isFinite(layout.left)){
    const rect = postitWidget.getBoundingClientRect();
    postitWidget.style.left = clampPostit(layout.left, gap, window.innerWidth - rect.width - gap) + "px";
    postitWidget.style.right = "auto";
  }
  setPostitSizeButton(!!layout.large);
}

function storePostitLayout(layout){
  postitLayout = layout;
  try{ localStorage.setItem(POSTIT_LAYOUT_KEY, JSON.stringify(layout)); }catch(e){}
}

function currentPostitLayout(custom, large, restore){
  const rect = postitWidget.getBoundingClientRect();
  return {
    left:Math.round(rect.left),
    top:custom ? Math.round(rect.top) : null,
    width:custom ? Math.round(rect.width) : null,
    height:custom ? Math.round(rect.height) : null,
    large:!!large,
    restore:restore || null
  };
}

postitSizeBtn.addEventListener("click", function(){
  const isLarge = !!(postitLayout && postitLayout.large);
  if(isLarge){
    const restore = postitLayout.restore;
    const next = restore && typeof restore === "object"
      ? restore
      : {left:18,top:null,width:null,height:null,large:false,restore:null};
    storePostitLayout(next);
    applyPostitLayout(next);
    return;
  }

  const wasCustom = postitWidget.classList.contains("has-custom-size");
  const restore = currentPostitLayout(wasCustom, false, null);
  const rect = postitWidget.getBoundingClientRect();
  const gap = window.innerWidth <= 620 ? 10 : 18;
  const width = Math.min(620, window.innerWidth - gap * 2);
  const height = Math.min(600, window.innerHeight - gap * 2);
  const large = {
    left:clampPostit(rect.right - width, gap, window.innerWidth - width - gap),
    top:clampPostit(rect.bottom - height, gap, window.innerHeight - height - gap),
    width:width,
    height:height,
    large:true,
    restore:restore
  };
  storePostitLayout(large);
  applyPostitLayout(large);
});

postitHead.addEventListener("pointerdown", function(event){
  if(event.button !== 0 || event.target.closest("button")) return;
  const rect = postitWidget.getBoundingClientRect();
  const startX = event.clientX;
  const startLeft = rect.left;
  const gap = window.innerWidth <= 620 ? 10 : 18;
  postitWidget.style.left = startLeft + "px";
  postitWidget.style.right = "auto";
  postitHead.classList.add("is-dragging");
  postitHead.setPointerCapture(event.pointerId);

  function move(moveEvent){
    const maxLeft = window.innerWidth - postitWidget.getBoundingClientRect().width - gap;
    postitWidget.style.left = clampPostit(startLeft + moveEvent.clientX - startX, gap, maxLeft) + "px";
  }
  function end(endEvent){
    postitHead.classList.remove("is-dragging");
    try{ postitHead.releasePointerCapture(endEvent.pointerId); }catch(e){}
    postitHead.removeEventListener("pointermove", move);
    postitHead.removeEventListener("pointerup", end);
    postitHead.removeEventListener("pointercancel", end);
    const custom = postitWidget.classList.contains("has-custom-size");
    storePostitLayout(currentPostitLayout(custom, !!(postitLayout && postitLayout.large),
      postitLayout && postitLayout.restore));
  }
  postitHead.addEventListener("pointermove", move);
  postitHead.addEventListener("pointerup", end);
  postitHead.addEventListener("pointercancel", end);
});

postitResize.addEventListener("pointerdown", function(event){
  if(event.button !== 0) return;
  event.preventDefault();
  const rect = postitWidget.getBoundingClientRect();
  const startX = event.clientX;
  const startY = event.clientY;
  const startWidth = rect.width;
  const startHeight = rect.height;
  const gap = window.innerWidth <= 620 ? 10 : 18;
  postitWidget.classList.add("has-custom-size");
  postitWidget.style.left = rect.left + "px";
  postitWidget.style.top = rect.top + "px";
  postitWidget.style.right = "auto";
  postitWidget.style.bottom = "auto";
  postitWidget.style.width = rect.width + "px";
  postitWidget.style.height = rect.height + "px";
  postitResize.setPointerCapture(event.pointerId);

  function resize(moveEvent){
    const minWidth = Math.min(280, window.innerWidth - gap * 2);
    const maxWidth = window.innerWidth - rect.left - gap;
    const maxHeight = window.innerHeight - rect.top - gap;
    postitWidget.style.width =
      clampPostit(startWidth + moveEvent.clientX - startX, minWidth, maxWidth) + "px";
    postitWidget.style.height =
      clampPostit(startHeight + moveEvent.clientY - startY, 180, maxHeight) + "px";
  }
  function endResize(endEvent){
    try{ postitResize.releasePointerCapture(endEvent.pointerId); }catch(e){}
    postitResize.removeEventListener("pointermove", resize);
    postitResize.removeEventListener("pointerup", endResize);
    postitResize.removeEventListener("pointercancel", endResize);
    const next = currentPostitLayout(true, false, null);
    storePostitLayout(next);
    setPostitSizeButton(false);
  }
  postitResize.addEventListener("pointermove", resize);
  postitResize.addEventListener("pointerup", endResize);
  postitResize.addEventListener("pointercancel", endResize);
});

postitList.addEventListener("pointerdown", function(event){
  const grip = event.target.closest("[data-note-resize]");
  if(!grip || event.button !== 0) return;
  event.preventDefault();
  const note = postitNotes.find(function(item){ return item.id === grip.dataset.noteId; });
  const card = grip.closest(".postit-note");
  if(!note || !card) return;

  const edge = grip.dataset.noteResize;
  const startY = event.clientY;
  const startHeight = card.getBoundingClientRect().height;
  const startScroll = postitList.scrollTop;
  grip.setPointerCapture(event.pointerId);

  function resizeNote(moveEvent){
    const deltaY = moveEvent.clientY - startY;
    const height = clampPostit(
      edge === "top" ? startHeight - deltaY : startHeight + deltaY,
      92,
      520
    );
    card.style.height = height + "px";
    note.height = Math.round(height);
    if(edge === "top"){
      postitList.scrollTop = startScroll + height - startHeight;
    }
  }

  function endNoteResize(endEvent){
    try{ grip.releasePointerCapture(endEvent.pointerId); }catch(e){}
    grip.removeEventListener("pointermove", resizeNote);
    grip.removeEventListener("pointerup", endNoteResize);
    grip.removeEventListener("pointercancel", endNoteResize);
    savePostits();
  }

  grip.addEventListener("pointermove", resizeNote);
  grip.addEventListener("pointerup", endNoteResize);
  grip.addEventListener("pointercancel", endNoteResize);
});

postitList.addEventListener("input", function(event){
  const field = event.target.closest("[data-note-id]");

});

function decode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

/* 각 도구에서 고친 내용을 '파일 안에' 넣은 새 HTML 을 만들어 저장한다.
   이 파일을 받은 사람은 아무것도 누르지 않아도 수정된 데이터를 보게 된다. */
const EDIT_KEYS = { vendor: "winco_vendor_db_v1", parts: "winco_parts_db_v1",
  cs: "winco_cs_faqs_v1", product: "winco_products_v1", order: "winco_order_data_v1" };
const PRESET_VAR = { vendor: "PRESET", parts: "PRESET", cs: "CS_PRESET",
  product: "PR_PRESET", order: "OD_PRESET" };

window.wincoExportHub = function(){
  try{
    let changed = 0;
    const out = MODULES.map(function(m){
      const c = Object.assign({}, m);
      const key = EDIT_KEYS[m.id];
      const pvar = PRESET_VAR[m.id];
      if(!key || !pvar || !m.b64) return c;
      let saved = null;
      try{ saved = localStorage.getItem(key); }catch(e){}
      if(!saved) return c;
      let src = decode(m.b64);
      const mark = "const " + pvar + " = null; /*__WINCO_PRESET__*/";
      if(src.indexOf(mark) < 0) return c;
      const repl = "const " + pvar + " = " + saved + "; /*__WINCO_PRESET__*/";
      src = src.split(mark).join(repl);
      c.b64 = encode(src);
      changed++;
      return c;
    });
    if(changed === 0){
      alert("아직 고친 내용이 없습니다.\n금액을 수정한 뒤 다시 눌러주세요.");
      return false;
    }
    const root = document.documentElement.cloneNode(true);
    const tag = root.querySelector("#mod-data");
    tag.textContent = JSON.stringify(out).replace(/</g, "\\u003c");
    const fh = root.querySelector("#frameHost"); if(fh) fh.innerHTML = "";
    const vw = root.querySelector("#viewer"); if(vw) vw.setAttribute("aria-hidden","true");
    const bd = root.querySelector("body"); if(bd) bd.classList.remove("in-viewer");
    const html = "<!DOCTYPE html>\n" + root.outerHTML;
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "윈코_업무도구_수정본.html";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 200);
    alert("수정본 HTML 을 저장했습니다.\n\n이 파일을 팀원에게 전달하면, 받는 분은 아무것도 누르지 않아도 수정된 금액이 보입니다.");
    return true;
  }catch(e){
    alert("만들지 못했습니다: " + e.message);
    return false;
  }
};

let current = null;   // 지금 열려 있는 모듈 id (없으면 null)
const toolSearch = document.getElementById("toolSearch");
const searchClear = document.getElementById("searchClear");
const emptySearch = document.getElementById("emptySearch");

function markRecent(id){
  document.querySelectorAll(".card").forEach(function(card){
    card.classList.toggle("is-recent", card.dataset.mod === id);
  });
}
try{ markRecent(localStorage.getItem("winco_recent_tool")); }catch(e){}

function filterTools(){
  const q = (toolSearch.value || "").trim().toLocaleLowerCase("ko");
  let total = 0;
  document.querySelectorAll(".tool-section").forEach(function(section){
    let visible = 0;
    section.querySelectorAll(".card").forEach(function(card){
      const hit = !q || card.textContent.toLocaleLowerCase("ko").indexOf(q) >= 0;
      card.hidden = !hit;
      if(hit) visible++;
    });
    section.hidden = visible === 0;
    const count = section.querySelector(".section-count");
    if(count) count.textContent = visible;
    total += visible;
  });
  searchClear.classList.toggle("show", !!q);
  emptySearch.classList.toggle("show", total === 0);
}

toolSearch.addEventListener("input", filterTools);
searchClear.addEventListener("click", function(){ toolSearch.value=""; filterTools(); toolSearch.focus(); });

/* 모듈 열기. push=true 면 주소에 #모듈 을 남긴다. */
function openModule(id, push){
  const m = byId[id];
  if(!m) return;
  try{ localStorage.setItem("winco_recent_tool", id); }catch(e){}
  markRecent(id);
  if(current !== id){
    current = id;
    vName.textContent = m.name;
    vIco.textContent  = m.icon;
    viewer.style.setProperty("--vac", m.accent);
    frameHost.innerHTML = "";
    const f = document.createElement("iframe");
    f.setAttribute("title", m.name);
    f.setAttribute("allow", "clipboard-write; clipboard-read");
    f.srcdoc = decode(m.b64);
    frameHost.appendChild(f);
  }
  body.classList.add("in-viewer");
  viewer.setAttribute("aria-hidden","false");
  if(push !== false){
    try{ history.pushState({mod:id}, "", "#"+id); }catch(e){}
  }
}

/* 메뉴로 돌아가기. 히스토리에 의존하지 않고 항상 직접 처리한다. */
function goHome(clearHash){
  if(current === "cs"){
    try{
      const frame = frameHost.querySelector("iframe");
      const hasUnsaved = frame && frame.contentWindow &&
        typeof frame.contentWindow.wincoHasUnsavedChanges === "function" &&
        frame.contentWindow.wincoHasUnsavedChanges();
      if(hasUnsaved && !confirm("저장하지 않은 CS 매뉴얼 변경사항이 있습니다.\n저장하지 않고 메뉴로 돌아갈까요?")){
        if(!location.hash) history.replaceState({mod:current}, "", "#"+current);
        return false;
      }
    }catch(e){}
  }
  current = null;
  body.classList.remove("in-viewer");
  viewer.setAttribute("aria-hidden","true");
  setTimeout(function(){
    if(!body.classList.contains("in-viewer")) frameHost.innerHTML = "";
  }, 320);
  if(clearHash !== false){
    try{
      if(location.hash) history.replaceState({}, "", location.pathname + location.search);
    }catch(e){
      try{ location.hash = ""; }catch(e2){}
    }
  }
}

/* 주소의 #해시에 맞춰 화면을 맞춘다 (뒤로/앞으로, 직접 진입 대응) */
function syncFromHash(){
  const h = (location.hash || "").replace("#","");
  if(h && byId[h]) openModule(h, false);
  else goHome(false);
}

document.querySelectorAll(".card").forEach(function(c){
  c.addEventListener("click", function(){ openModule(c.dataset.mod, true); });
});

/* ← 메뉴 : 무조건 메뉴로 (history.back 사용 안 함) */
document.getElementById("backBtn").addEventListener("click", function(){
  goHome(true);
});

/* 브라우저 뒤로/앞으로 버튼 + 주소창 해시 변경 */
window.addEventListener("popstate",   syncFromHash);
window.addEventListener("hashchange", syncFromHash);

/* ESC 로도 메뉴 복귀 */
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && body.classList.contains("in-viewer")) goHome(true);
  if(e.key === "/" && !body.classList.contains("in-viewer") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault(); toolSearch.focus();
  }
});

/* 첫 진입 시 #모듈 이 있으면 그 모듈을 연다 */
syncFromHash();
