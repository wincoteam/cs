const products=document.getElementById("products");
const query=document.getElementById("query");
const clearBtn=document.getElementById("clearBtn");
const empty=document.getElementById("empty");
const resultText=document.getElementById("resultText");
let category="air";
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(v){return String(v||"").toLocaleLowerCase("ko").replace(/\s+/g," ")}
function marked(v,q){const safe=esc(v);if(!q)return safe;const pos=norm(v).indexOf(q);if(pos<0)return safe;return safe}
function render(){
  const q=norm(query.value.trim());
  clearBtn.classList.toggle("show",!!q);
  if(category!=="air"){
    products.innerHTML="";empty.textContent="현재 등록된 FAQ가 없습니다.";empty.classList.add("show");resultText.textContent="결과 없음";return;
  }
  const list=P.filter(p=>!q||norm([p.name,p.model,...p.sections.flat(2),...p.faqs.flat(2)].join(" ")).includes(q));
  products.innerHTML=list.map(p=>`
    <details class="product" style="--psoft:${p.soft}" ${q?"open":""}>
      <summary><span class="pico">${p.icon}</span><span class="ptext"><span class="pname">${esc(p.name)}</span><span class="pmodel">${esc(p.model)}</span></span><span class="arrow">›</span></summary>
      <div class="product-body">
        <div class="sections">${p.sections.map((s,i)=>`
          <details class="section" ${q&&norm(s.flat().join(" ")).includes(q)?"open":""}>
            <summary>${esc(s[0])}</summary>
            <div class="section-body">${s[1].map((line,j)=>`<div class="${j===s[1].length-1&&line.startsWith("※")?"notice":"line"}">${esc(line)}</div>`).join("")}</div>
          </details>`).join("")}
        </div>
        <div class="faq-title">📖 자주 묻는 질문</div>
        ${p.faqs.map(qa=>`
          <details class="qa" ${q&&norm(qa.join(" ")).includes(q)?"open":""}>
            <summary>${esc(qa[0])}</summary>
            <div class="answer">${esc(qa[1])}<button class="copy" type="button" data-copy="${esc(qa[1])}">복사</button></div>
          </details>`).join("")}
        <a class="original" href="${p.url}" target="_blank" rel="noopener">이 제품의 Notion 원본 보기 ↗</a>
      </div>
    </details>`).join("");
  empty.textContent="검색 결과가 없습니다.";empty.classList.toggle("show",list.length===0);
  resultText.textContent=q?`검색 결과 ${list.length}개 제품`:`에어건 ${list.length}개 제품`;
}
query.addEventListener("input",render);
clearBtn.addEventListener("click",()=>{query.value="";render();query.focus()});
document.querySelector(".cats").addEventListener("click",e=>{
  const btn=e.target.closest("[data-cat]");if(!btn)return;
  category=btn.dataset.cat;document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("on",x===btn));render();
});
products.addEventListener("click",async e=>{
  const btn=e.target.closest("[data-copy]");if(!btn)return;
  try{await navigator.clipboard.writeText(btn.dataset.copy);btn.textContent="복사됨";setTimeout(()=>btn.textContent="복사",1200)}
  catch(err){btn.textContent="실패"}
});
render();
</script>

</html>
