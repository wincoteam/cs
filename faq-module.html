<style>

*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 8% 0,rgba(10,107,86,.08),transparent 30%),var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.58;-webkit-font-smoothing:antialiased}

.care{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px}

mark{border-radius:4px;background:#fff0a8;color:inherit;padding:0 2px}
@media(max-width:650px){.wrap{padding:25px 14px 52px}.hero{display:block}.source{display:inline-block;margin-top:12px}h1{font-size:27px}.product>summary{padding:12px 13px}.product-body{padding:0 11px 12px}.care{grid-template-columns:1fr}}

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(v){return String(v||"").toLocaleLowerCase("ko").replace(/\s+/g," ")}
function marked(v,q){const safe=esc(v);if(!q)return safe;const pos=norm(v).indexOf(q);if(pos<0)return safe;return safe}
function isSectionSubhead(line){
  const text=String(line||"").trim();
  if(!text||/[.!?。]$/.test(text))return false;
  if(/^(?:✅|❌|⚠️|📌|▶|◆|▲|■|\[)/.test(text))return true;
  if(/^[A-Z0-9][A-Z0-9 .+&()\/-]{0,28}$/.test(text))return true;
  return text.length<=42&&/(?:기능|보호|감지|지원|증정|설계|조절|탑재|호환|주입|배출|팽창력|높이|소재|휴대성|성능|디테일|용량|코팅|처리|뚜껑|코드|방법|모드|단계|방식|구조)$/.test(text);
}
function faqAnswerHtml(value){
  const lines=String(value||"").split(/\r?\n/);
  const hasNestedQuestions=lines.some(line=>/[?？]\s*$/.test(line.trim()));
  if(!hasNestedQuestions){
    return `<div class="answer-row response"><span class="answer-badge">A</span><span class="answer-text">${esc(value)}</span></div>`;
  }
  let waitingForAnswer=false;
  return lines.map(line=>{
    const text=line.trim();
    if(!text)return '<div class="answer-row detail"><span class="answer-text">&nbsp;</span></div>';
    if(/[?？]\s*$/.test(text)){
      waitingForAnswer=true;
      return `<div class="answer-row question"><span class="answer-badge">Q</span><span class="answer-text">${esc(text)}</span></div>`;
    }
    if(waitingForAnswer){
      waitingForAnswer=false;
      return `<div class="answer-row response"><span class="answer-badge">A</span><span class="answer-text">${esc(text)}</span></div>`;
    }
    return `<div class="answer-row detail"><span class="answer-text">${esc(text)}</span></div>`;
  }).join("");
}

        <a class="original" href="${p.url}" target="_blank" rel="noopener">이 제품의 Notion 원본 보기 ↗</a>
      </div>
    </details>`).join("");
  empty.textContent="검색 결과가 없습니다.";empty.classList.toggle("show",list.length===0);

}
