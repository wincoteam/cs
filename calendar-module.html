<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업무 캘린더</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#17231e;--sub:#68766f;--line:#dbe5e0;--green:#0a6b56;--green2:#238a70;--soft:#eaf5f1;--amber:#b7791f;--shadow:0 13px 34px rgba(24,48,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",sans-serif;line-height:1.5}.wrap{max-width:1180px;margin:auto;padding:30px 24px 48px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}.eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:.14em}.hero h1{margin:4px 0 3px;font-size:29px;letter-spacing:-.035em}.lead{margin:0;color:var(--sub);font-size:13px}.today-btn,.nav-btn,.new-btn,.ghost,.save,.delete{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:12px;font-weight:800;cursor:pointer}.today-btn{height:40px;padding:0 16px}.today-btn:hover,.nav-btn:hover,.ghost:hover{border-color:#9ec6b8;background:#f7fbf9}.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.8fr);gap:16px;align-items:start}.calendar-card,.day-panel{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow)}.calendar-card{overflow:hidden}.calendar-head{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--line)}.month-title{font-size:18px;font-weight:900;letter-spacing:-.02em}.month-nav{display:flex;gap:7px}.nav-btn{display:grid;width:36px;height:36px;place-items:center;font-size:17px}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays{padding:0 10px;border-bottom:1px solid var(--line);background:#f8faf9}.weekday{padding:10px 4px;text-align:center;color:#77847e;font-size:11px;font-weight:800}.weekday:first-child{color:#c05c55}.weekday:last-child{color:#527ab4}.calendar-grid{padding:10px}.day{position:relative;min-height:103px;padding:9px;border:1px solid transparent;border-radius:13px;background:transparent;text-align:left;font:inherit;color:var(--ink);cursor:pointer;overflow:hidden}.day:hover{border-color:#bad5cb;background:#f6fbf9}.day.is-selected{border-color:var(--green);background:#eef8f4;box-shadow:inset 0 0 0 1px var(--green)}.day.is-today .day-number{background:var(--green);color:#fff}.day.is-other{color:#aab4af}.day.is-other .day-preview{opacity:.55}.day-number{display:grid;width:25px;height:25px;place-items:center;border-radius:8px;font-size:12px;font-weight:800}.day:nth-child(7n+1) .day-number{color:#c05c55}.day:nth-child(7n) .day-number{color:#527ab4}.day.is-today .day-number{color:#fff}.day-count{position:absolute;right:9px;top:10px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#dceee7;color:var(--green);font-size:10px;font-weight:900;text-align:center;line-height:20px}.day-preview{display:block;margin-top:8px;padding:5px 6px;border-left:3px solid var(--event,#0a6b56);border-radius:4px;background:#f4f7f6;color:#52615b;font-size:10px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day-preview.is-done{text-decoration:line-through;color:#98a39e}.day-panel{position:sticky;top:18px;overflow:hidden}.day-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fbfdfc,#edf7f3)}.selected-label{color:var(--green);font-size:10px;font-weight:900;letter-spacing:.08em}.selected-date{margin-top:2px;font-size:17px;font-weight:900}.new-btn{height:36px;padding:0 12px;border-color:var(--green);background:var(--green);color:#fff}.new-btn:hover{background:#075443}.agenda{display:flex;flex-direction:column;gap:9px;padding:14px;max-height:270px;overflow:auto}.empty{padding:34px 14px;text-align:center;color:#88958f;font-size:12px}.event{display:grid;grid-template-columns:27px minmax(0,1fr);align-items:start;width:100%;border:1px solid var(--line);border-left:4px solid var(--event,#0a6b56);border-radius:12px;background:#fff;overflow:hidden}.event:hover{border-color:#b9d4ca;background:#fbfdfc}.event-check{display:grid;min-height:52px;place-items:center;padding:11px 0 0 8px}.event-check input{width:17px;height:17px;margin:0;accent-color:var(--green);cursor:pointer}.event-open{min-width:0;padding:11px 11px 11px 6px;border:0;background:transparent;text-align:left;font:inherit;cursor:pointer}.event-top{display:flex;align-items:center;gap:7px}.event-time{flex:none;color:var(--green);font-size:10px;font-weight:850}.event-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:850}.event-note{display:-webkit-box;margin-top:4px;overflow:hidden;color:var(--sub);font-size:11px;line-height:1.45;-webkit-box-orient:vertical;-webkit-line-clamp:2}.event.is-done .event-title,.event.is-done .event-note{text-decoration:line-through;color:#929e98}.editor{padding:15px;border-top:1px solid var(--line);background:#fafcfb}.editor[hidden]{display:none}.field{display:block;margin-bottom:10px}.field span{display:block;margin:0 0 5px;color:#5f6c66;font-size:10px;font-weight:850}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:12px;outline:none}.input{height:39px;padding:0 11px}.textarea{min-height:95px;padding:10px 11px;resize:vertical;line-height:1.55}.input:focus,.textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(10,107,86,.1)}.field-row{display:grid;grid-template-columns:110px 1fr;gap:10px}.colors{display:flex;align-items:center;gap:7px;height:39px}.color{width:22px;height:22px;border:3px solid #fff;border-radius:50%;background:var(--color);box-shadow:0 0 0 1px #cdd9d4;cursor:pointer}.color.active{box-shadow:0 0 0 2px var(--ink)}.editor-actions{display:flex;gap:7px;margin-top:13px}.editor-actions button{height:38px;padding:0 13px}.save{flex:1;border-color:var(--green);background:var(--green);color:#fff}.delete{border-color:#ecd1cf;background:#fff;color:#b34e47}.ghost{background:#fff}.save:hover{background:#075443}.delete[hidden]{display:none}.storage-note{padding:0 16px 15px;color:#97a29d;font-size:9.5px;text-align:center}
@media(max-width:850px){.workspace{grid-template-columns:1fr}.day-panel{position:static}.agenda{max-height:none}.day{min-height:88px}}
@media(max-width:620px){.wrap{padding:22px 12px 36px}.hero{align-items:flex-start}.hero h1{font-size:25px}.lead{max-width:260px}.today-btn{height:36px;padding:0 11px}.calendar-head{padding:14px}.calendar-grid{padding:5px}.weekdays{padding:0 5px}.day{min-height:67px;padding:5px;border-radius:9px}.day-number{width:22px;height:22px}.day-count{right:4px;top:5px;min-width:17px;height:17px;padding:0 4px;line-height:17px}.day-preview{margin-top:5px;padding:3px 4px;border-left-width:2px;font-size:8px}.field-row{grid-template-columns:95px 1fr}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div><div class="eyebrow">WINCO SCHEDULE</div><h1>📅 업무 캘린더</h1><p class="lead">날짜를 선택해 일정과 메모를 기록하고 한눈에 확인하세요.</p></div>
    <button class="today-btn" id="todayBtn" type="button">오늘로 이동</button>
  </header>
  <section class="workspace">
    <article class="calendar-card" aria-label="월간 업무 캘린더">
      <div class="calendar-head"><strong class="month-title" id="monthTitle"></strong><div class="month-nav"><button class="nav-btn" id="prevBtn" type="button" aria-label="이전 달">‹</button><button class="nav-btn" id="nextBtn" type="button" aria-label="다음 달">›</button></div></div>
      <div class="weekdays" aria-hidden="true"><span class="weekday">일</span><span class="weekday">월</span><span class="weekday">화</span><span class="weekday">수</span><span class="weekday">목</span><span class="weekday">금</span><span class="weekday">토</span></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </article>
    <aside class="day-panel" aria-label="선택한 날짜의 일정">
      <div class="day-panel-head"><div><div class="selected-label">SELECTED DATE</div><div class="selected-date" id="selectedDate"></div></div><button class="new-btn" id="newBtn" type="button">+ 메모 추가</button></div>
      <div class="agenda" id="agenda"></div>
      <form class="editor" id="editor" hidden>
        <label class="field"><span>제목</span><input class="input" id="eventTitle" maxlength="80" required placeholder="예: 반품 건 확인"></label>
        <div class="field-row"><label class="field"><span>시간 (선택)</span><input class="input" id="eventTime" type="time"></label><div class="field"><span>표시 색상</span><div class="colors" id="colors"><button class="color active" type="button" data-color="#0a6b56" style="--color:#0a6b56" aria-label="초록"></button><button class="color" type="button" data-color="#b7791f" style="--color:#b7791f" aria-label="노랑"></button><button class="color" type="button" data-color="#527ab4" style="--color:#527ab4" aria-label="파랑"></button><button class="color" type="button" data-color="#9b67a5" style="--color:#9b67a5" aria-label="보라"></button><button class="color" type="button" data-color="#c05c55" style="--color:#c05c55" aria-label="빨강"></button></div></div></div>
        <label class="field"><span>메모</span><textarea class="textarea" id="eventNote" maxlength="1000" placeholder="업무 내용이나 확인할 사항을 적어주세요."></textarea></label>
        <div class="editor-actions"><button class="delete" id="deleteBtn" type="button" hidden>삭제</button><button class="ghost" id="cancelBtn" type="button">취소</button><button class="save" type="submit">저장하기</button></div>
      </form>
      <div class="storage-note">작성한 일정은 이 기기에 자동 저장됩니다.</div>
    </aside>
  </section>
</main>
<script>
(function(){
  "use strict";
  const KEY="winco_calendar_events_v1";
  const $=id=>document.getElementById(id);
  const grid=$("calendarGrid"),monthTitle=$("monthTitle"),selectedDate=$("selectedDate"),agenda=$("agenda"),editor=$("editor"),titleInput=$("eventTitle"),timeInput=$("eventTime"),noteInput=$("eventNote"),deleteBtn=$("deleteBtn"),colors=$("colors");
  const today=new Date(); today.setHours(0,0,0,0);
  let view=new Date(today.getFullYear(),today.getMonth(),1),selected=key(today),editingId="",activeColor="#0a6b56",events=load();
  function key(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,"0"),String(date.getDate()).padStart(2,"0")].join("-")}
  function fromKey(value){const p=value.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
  function load(){try{const value=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(value)?value:[]}catch(e){return[]}}
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(events))}catch(e){}
    try{if(window.parent&&window.parent!==window)window.parent.postMessage({wincoCalendarUpdated:true},"*")}catch(e){}
  }
  function escapeText(value){return String(value||"")}
  function formatSelected(value){const d=fromKey(value);return new Intl.DateTimeFormat("ko-KR",{month:"long",day:"numeric",weekday:"short"}).format(d)}
  function rowsFor(dateKey){return events.filter(e=>e.date===dateKey).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")||a.createdAt-b.createdAt)}
  function renderCalendar(){
    monthTitle.textContent=view.getFullYear()+"년 "+(view.getMonth()+1)+"월";
    grid.innerHTML="";
    const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
    for(let i=0;i<42;i++){
      const date=new Date(start);date.setDate(start.getDate()+i);const dateKey=key(date),rows=rowsFor(dateKey);const button=document.createElement("button");button.type="button";button.className="day";button.dataset.date=dateKey;button.setAttribute("aria-label",formatSelected(dateKey)+(rows.length?", 메모 "+rows.length+"개":""));
      if(date.getMonth()!==view.getMonth())button.classList.add("is-other");if(dateKey===key(today))button.classList.add("is-today");if(dateKey===selected)button.classList.add("is-selected");
      const number=document.createElement("span");number.className="day-number";number.textContent=date.getDate();button.appendChild(number);
      if(rows.length){const count=document.createElement("span");count.className="day-count";count.textContent=rows.length;button.appendChild(count);const preview=document.createElement("span");preview.className="day-preview"+(rows[0].completed?" is-done":"");preview.style.setProperty("--event",rows[0].color||activeColor);preview.textContent=(rows[0].time?rows[0].time+" ":"")+rows[0].title;button.appendChild(preview)}
      grid.appendChild(button);
    }
  }
  function renderAgenda(){
    selectedDate.textContent=formatSelected(selected);agenda.innerHTML="";const rows=rowsFor(selected);
    if(!rows.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="등록된 일정이 없습니다.\n‘메모 추가’를 눌러 기록해 보세요.";empty.style.whiteSpace="pre-line";agenda.appendChild(empty);return}
    rows.forEach(row=>{const article=document.createElement("article");article.className="event"+(row.completed?" is-done":"");article.dataset.id=row.id;article.style.setProperty("--event",row.color||activeColor);const checkLabel=document.createElement("label");checkLabel.className="event-check";const check=document.createElement("input");check.type="checkbox";check.className="event-toggle";check.checked=Boolean(row.completed);check.setAttribute("aria-label",row.title+" 완료");checkLabel.appendChild(check);article.appendChild(checkLabel);const button=document.createElement("button");button.type="button";button.className="event-open";const top=document.createElement("span");top.className="event-top";if(row.time){const time=document.createElement("span");time.className="event-time";time.textContent=row.time;top.appendChild(time)}const title=document.createElement("span");title.className="event-title";title.textContent=row.title;top.appendChild(title);button.appendChild(top);if(row.note){const note=document.createElement("span");note.className="event-note";note.textContent=row.note;button.appendChild(note)}article.appendChild(button);agenda.appendChild(article)});
  }
  function render(){renderCalendar();renderAgenda()}
  function chooseColor(color){activeColor=color;colors.querySelectorAll(".color").forEach(b=>b.classList.toggle("active",b.dataset.color===color))}
  function openEditor(row){editingId=row?row.id:"";titleInput.value=row?escapeText(row.title):"";timeInput.value=row?escapeText(row.time):"";noteInput.value=row?escapeText(row.note):"";chooseColor(row&&row.color?row.color:"#0a6b56");deleteBtn.hidden=!row;editor.hidden=false;setTimeout(()=>titleInput.focus(),0)}
  function closeEditor(){editor.hidden=true;editingId=""}
  grid.addEventListener("click",e=>{const day=e.target.closest(".day");if(!day)return;selected=day.dataset.date;const d=fromKey(selected);if(d.getMonth()!==view.getMonth()||d.getFullYear()!==view.getFullYear())view=new Date(d.getFullYear(),d.getMonth(),1);closeEditor();render()});
  agenda.addEventListener("change",e=>{const toggle=e.target.closest(".event-toggle");if(!toggle)return;const article=toggle.closest(".event");events=events.map(item=>item.id===article.dataset.id?Object.assign({},item,{completed:toggle.checked,completedAt:toggle.checked?Date.now():null,updatedAt:Date.now()}):item);save();render()});
  agenda.addEventListener("click",e=>{const button=e.target.closest(".event-open");if(!button)return;const article=button.closest(".event"),row=events.find(item=>item.id===article.dataset.id);if(row)openEditor(row)});
  $("prevBtn").addEventListener("click",()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar()});
  $("nextBtn").addEventListener("click",()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()});
  $("todayBtn").addEventListener("click",()=>{selected=key(today);view=new Date(today.getFullYear(),today.getMonth(),1);closeEditor();render()});
  $("newBtn").addEventListener("click",()=>openEditor(null));$("cancelBtn").addEventListener("click",closeEditor);
  colors.addEventListener("click",e=>{const button=e.target.closest(".color");if(button)chooseColor(button.dataset.color)});
  editor.addEventListener("submit",e=>{e.preventDefault();const title=titleInput.value.trim();if(!title){titleInput.focus();return}const old=events.find(item=>item.id===editingId);const row={id:editingId||"cal-"+Date.now().toString(36),date:selected,title:title,time:timeInput.value,note:noteInput.value.trim(),color:activeColor,completed:old?Boolean(old.completed):false,completedAt:old?old.completedAt||null:null,createdAt:old?old.createdAt:Date.now(),updatedAt:Date.now()};events=editingId?events.map(item=>item.id===editingId?row:item):events.concat(row);save();closeEditor();render()});
  deleteBtn.addEventListener("click",()=>{if(!editingId||!confirm("이 일정을 삭제할까요?"))return;events=events.filter(item=>item.id!==editingId);save();closeEditor();render()});
  window.addEventListener("message",event=>{if(event.data&&event.data.wincoCalendarUpdated){events=load();render()}});
  window.addEventListener("storage",event=>{if(event.key===KEY){events=load();render()}});
  render();
})();
</script>
</body>
</html>
