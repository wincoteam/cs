<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>복사 보관함</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f4f7f6;--surface:#fff;--ink:#17231f;--muted:#68756f;--line:#dce5e1;--accent:#176b57;--soft:#e8f3ef;--gold:#b68125;--danger:#b2483e;--shadow:0 12px 32px rgba(30,55,46,.07)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 6% 0,rgba(23,107,87,.09),transparent 31%),var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:36px 22px 70px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:23px}
.eyebrow{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.14em}
h1{margin:5px 0 4px;font-size:30px;line-height:1.2;letter-spacing:-.045em}
.lead{margin:0;color:var(--muted);font-size:14px}
.summary{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.78);font-size:12px;font-weight:750;white-space:nowrap}
.pill b{color:var(--accent)}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.88);box-shadow:var(--shadow)}
.search{position:relative}
.search input{width:100%;height:44px;padding:0 42px 0 42px;border:1px solid #d5dfdb;border-radius:12px;background:#fff;color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,107,87,.12)}
.search::before{content:"⌕";position:absolute;left:15px;top:7px;color:var(--accent);font-size:23px}
.clear{display:none;position:absolute;right:8px;top:7px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#84908b;font-size:18px}
.clear.show{display:block}
.primary{height:44px;padding:0 17px;border:1px solid var(--accent);border-radius:12px;background:var(--accent);color:#fff;font-weight:850;box-shadow:0 6px 15px rgba(23,107,87,.18)}
.tabs{display:flex;gap:7px;overflow:auto;padding:14px 1px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#5f6d67;font-size:12.5px;font-weight:800}
.tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:17px 2px 10px}
.section-head h2{margin:0;font-size:17px;letter-spacing:-.025em}
.section-head p{margin:0;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.item{min-width:0;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 5px 18px rgba(26,47,40,.045);transition:.16s ease}
.item:hover{transform:translateY(-2px);border-color:#b8cec5;box-shadow:var(--shadow)}
.item-top{display:flex;align-items:center;gap:8px}
.kind{padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:10.5px;font-weight:850}
.item-title{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:900}
.star,.more{display:grid;width:31px;height:31px;place-items:center;border:0;border-radius:9px;background:transparent;color:#9aa39f}
.star{font-size:19px}
.star.on{color:#d39a28}
.star:hover,.more:hover{background:#f1f5f3}
.content{height:66px;margin:12px 0 14px;padding:10px 11px;overflow:hidden;border-radius:11px;background:#f6f8f7;color:#47564f;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.item-foot{display:flex;align-items:center;gap:7px}
.copy{flex:1;height:37px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:850}
.edit-direct{height:37px;padding:0 12px;border:1px solid #c9d8d2;border-radius:10px;background:#fff;color:#52635c;font-size:12px;font-weight:850}
.edit-direct:hover{border-color:var(--accent);color:var(--accent);background:#f7fbf9}
.open-link{height:37px;padding:0 12px;border:1px solid #c9d8d2;border-radius:10px;background:#fff;color:var(--accent);font-size:12px;font-weight:850;text-decoration:none;display:flex;align-items:center}
.usage{color:#89938f;font-size:10.5px;white-space:nowrap}
.menu{position:relative}
.menu-pop{display:none;position:absolute;right:0;top:35px;z-index:4;width:110px;padding:5px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 12px 30px rgba(20,38,32,.15)}
.menu.open .menu-pop{display:block}
.menu-pop button{width:100%;padding:8px 9px;border:0;border-radius:7px;background:transparent;text-align:left;font-size:12px;font-weight:750}
.menu-pop button:hover{background:#f1f5f3}
.menu-pop .delete{color:var(--danger)}
.empty{display:none;padding:62px 18px;border:1px dashed #cbd8d3;border-radius:17px;background:rgba(255,255,255,.58);text-align:center;color:var(--muted)}
.empty.show{display:block}
.empty strong{display:block;margin-bottom:5px;color:#3c4c45;font-size:15px}
dialog{width:min(580px,calc(100vw - 28px));padding:0;border:0;border-radius:19px;background:#fff;color:var(--ink);box-shadow:0 25px 80px rgba(17,35,29,.28)}
dialog::backdrop{background:rgba(22,37,32,.38);backdrop-filter:blur(3px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dialog-head strong{font-size:17px}
.dialog-close{width:34px;height:34px;border:0;border-radius:10px;background:#f1f5f3;color:#66736e;font-size:19px}
.form{display:grid;grid-template-columns:145px 1fr;gap:13px;padding:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:850;color:#56635e}
.field input,.field select,.field textarea{width:100%;border:1px solid #d4dfda;border-radius:11px;background:#fff;color:var(--ink);outline:none}
.field input,.field select{height:42px;padding:0 11px}
.field textarea{min-height:150px;padding:11px 12px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,107,87,.11)}
.favorite-check{display:flex;align-items:center;gap:8px;grid-column:1/-1;font-size:12.5px;font-weight:750}
.favorite-check input{width:17px;height:17px;accent-color:var(--accent)}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px}
.secondary{height:41px;padding:0 15px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#56635e;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,16px);padding:10px 15px;border-radius:999px;background:#18362e;color:#fff;font-size:12.5px;font-weight:800;opacity:0;pointer-events:none;transition:.2s ease;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.wrap{padding:25px 14px 55px}.top{display:block}.summary{justify-content:flex-start;margin-top:15px}.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.primary{width:100%}.form{grid-template-columns:1fr}.field.wide,.favorite-check{grid-column:1}.section-head{align-items:flex-start;flex-direction:column;gap:2px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div><div class="eyebrow">WINCO QUICK COPY</div><h1>📋 복사 보관함</h1><p class="lead">반복해서 사용하는 내용을 저장하고 한 번에 복사하세요.</p></div>
    <div class="summary" aria-label="보관함 요약"><span class="pill">저장 <b id="itemCount">0</b>개</span><span class="pill">즐겨찾기 <b id="favoriteCount">0</b>개</span></div>
  </header>

  <section class="toolbar" aria-label="검색 및 추가">
    <div class="search"><input id="searchInput" type="search" placeholder="제목이나 내용 검색" autocomplete="off" aria-label="보관함 검색"><button class="clear" id="clearSearch" type="button" aria-label="검색어 지우기">×</button></div>
    <button class="primary" id="addButton" type="button">＋ 항목 추가</button>
  </section>

  <nav class="tabs" id="tabs" aria-label="보관함 분류">
    <button class="tab active" type="button" data-filter="all">전체</button>
    <button class="tab" type="button" data-filter="recent">최근 복사</button>
    <button class="tab" type="button" data-filter="frequent">자주 사용</button>
    <button class="tab" type="button" data-filter="favorite">즐겨찾기</button>
    <button class="tab" type="button" data-filter="답변">답변</button>
    <button class="tab" type="button" data-filter="주소">주소</button>
    <button class="tab" type="button" data-filter="계좌">계좌</button>
    <button class="tab" type="button" data-filter="링크">링크</button>
    <button class="tab" type="button" data-filter="연락처">연락처</button>
    <button class="tab" type="button" data-filter="기타">기타</button>
  </nav>

  <div class="section-head"><div><h2 id="listTitle">전체 보관함</h2><p id="resultText">저장된 내용을 보여드립니다.</p></div></div>
  <section class="grid" id="itemGrid" aria-live="polite"></section>
  <div class="empty" id="emptyState"><strong>표시할 항목이 없습니다</strong><span>새 항목을 추가하거나 다른 분류를 선택해 주세요.</span></div>
</main>

<dialog id="itemDialog">
  <form id="itemForm" method="dialog">
    <div class="dialog-head"><strong id="dialogTitle">새 항목 추가</strong><button class="dialog-close" type="button" id="dialogClose" aria-label="닫기">×</button></div>
    <div class="form">
      <div class="field"><label for="kindInput">종류</label><select id="kindInput"><option>답변</option><option>주소</option><option>계좌</option><option>링크</option><option>연락처</option><option>기타</option></select></div>
      <div class="field"><label for="titleInput">제목</label><input id="titleInput" maxlength="80" placeholder="예: 반품 안내" required></div>
      <div class="field wide"><label for="contentInput">복사할 내용</label><textarea id="contentInput" placeholder="고객에게 보낼 답변, 주소, 계좌번호 또는 링크를 입력하세요." required></textarea></div>
      <label class="favorite-check"><input id="favoriteInput" type="checkbox">개인 즐겨찾기에 추가</label>
    </div>
    <div class="dialog-foot"><button class="secondary" id="cancelButton" type="button">취소</button><button class="primary" type="submit">저장</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite">복사했습니다</div>

<script>
const STORAGE_KEY="winco_clipboard_v1";
const HISTORY_KEY="winco_clipboard_history_v1";
const SCHEMA_KEY="winco_clipboard_schema_v2";
const DEFAULT_ITEMS=[
  {id:"default-warehouse",kind:"주소",title:"인천 창고 · 보상판매 반납",content:"이름 : 윈코 보상판매센터 / 물류센터\n주소 : 인천시 검단구 오류동 1544-3번지 은산해운창고",favorite:true,count:0,copiedAt:0},
  {id:"default-as",kind:"주소",title:"고빅스 · 제품 검수 및 A/S",content:"이름 : 윈코 A/S 센터\n주소 : 서울 양천구 오목로17길 8 1층\n전화번호 : 010-5929-2438",favorite:true,count:0,copiedAt:0},
  {id:"default-office",kind:"주소",title:"윈코 사무실 · 특이사항 검수",content:"이름 : 윈코\n주소 : 서울특별시 금천구 디지털로10길 37, 가산아스크타워 A동 1711~1718호\n전화번호 : 070-4722-9200",favorite:false,count:0,copiedAt:0},
  {id:"default-talk",kind:"링크",title:"네이버 톡톡",content:"https://talk.naver.com/ct/wc3l0s?frm=psf",favorite:false,count:0,copiedAt:0},
  {id:"default-care",kind:"링크",title:"A/S 접수",content:"https://careplz.kr/",favorite:true,count:0,copiedAt:0},
  {id:"default-care-guide",kind:"링크",title:"A/S 접수방법",content:"https://wincoservice.notion.site/WINCO-A-S-2c74f43a7c128084893afb6a941883e5?pvs=73",favorite:false,count:0,copiedAt:0},
  {id:"default-faq",kind:"링크",title:"WINCO FAQ",content:"https://wincoservice.notion.site/WINCO-FAQ-21c4f43a7c128072a213f32d59c69144?source=copy_link",favorite:false,count:0,copiedAt:0},
  {id:"default-roborock-center",kind:"연락처",title:"로보락 고객센터",content:"로보락 고객센터 대표번호 : 1577-8911",favorite:true,count:0,copiedAt:0}
];
let items=loadItems();
let activeFilter="all";
let editingId=null;
let toastTimer=null;
let currentResult=[];
const grid=document.getElementById("itemGrid");
const searchInput=document.getElementById("searchInput");
const dialog=document.getElementById("itemDialog");
const form=document.getElementById("itemForm");

function clone(value){return JSON.parse(JSON.stringify(value))}
function makeId(){return "copy-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function loadItems(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(saved)){
      const normalized=saved.filter(item=>item&&item.id&&item.title&&item.content).map(item=>({kind:"기타",favorite:false,count:0,copiedAt:0,...item}));
      if(localStorage.getItem(SCHEMA_KEY)!=="2"){
        const roborock=DEFAULT_ITEMS.find(item=>item.id==="default-roborock-center");
        if(roborock&&!normalized.some(item=>item.id===roborock.id)) normalized.push(clone(roborock));
        localStorage.setItem(SCHEMA_KEY,"2");
        localStorage.setItem(STORAGE_KEY,JSON.stringify(normalized));
      }
      return normalized;
    }
  }catch(e){}
  try{localStorage.setItem(SCHEMA_KEY,"2")}catch(e){}
  return clone(DEFAULT_ITEMS);
}
function saveItems(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(items))}catch(e){showToast("저장 공간을 확인해 주세요")}}
function loadHistory(){try{const rows=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");return Array.isArray(rows)?rows.filter(row=>row&&row.content):[]}catch(e){return []}}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]))}
function isUrl(value){try{const url=new URL(value.trim());return url.protocol==="http:"||url.protocol==="https:"}catch(e){return false}}
function visibleItems(){
  const q=searchInput.value.trim().toLocaleLowerCase("ko");
  let result;
  if(activeFilter==="recent"){
    const used=new Set();
    result=loadHistory().map(row=>{
      const saved=items.find(item=>item.content.trim()===String(row.content).trim());
      used.add(String(row.content).trim());
      if(saved){saved.copiedAt=Math.max(Number(saved.copiedAt||0),Number(row.copiedAt||0));return saved}
      return {id:row.id,kind:"최근",title:row.title||"최근 복사",content:String(row.content),favorite:false,count:0,copiedAt:Number(row.copiedAt||0),history:true};
    });
    items.filter(item=>item.copiedAt>0&&!used.has(item.content.trim())).forEach(item=>result.push(item));
    result=result.sort((a,b)=>b.copiedAt-a.copiedAt);
  }else result=items.slice();
  result=result.filter(item=>!q||(item.title+" "+item.content+" "+item.kind).toLocaleLowerCase("ko").includes(q));
  if(activeFilter==="frequent") result=result.filter(item=>item.count>0).sort((a,b)=>b.count-a.count||b.copiedAt-a.copiedAt);
  else if(activeFilter==="favorite") result=result.filter(item=>item.favorite);
  else if(activeFilter!=="all"&&activeFilter!=="recent") result=result.filter(item=>item.kind===activeFilter);
  else if(activeFilter==="all") result=result.slice().sort((a,b)=>Number(b.favorite)-Number(a.favorite)||b.copiedAt-a.copiedAt);
  return result;
}
function render(){
  const result=visibleItems();
  currentResult=result;
  const titles={all:"전체 보관함",recent:"최근 복사",frequent:"자주 사용",favorite:"개인 즐겨찾기"};
  document.getElementById("listTitle").textContent=titles[activeFilter]||activeFilter;
  document.getElementById("resultText").textContent=result.length+"개의 항목"+(searchInput.value.trim()?"이 검색되었습니다.":"을 보여드립니다.");
  document.getElementById("itemCount").textContent=items.length;
  document.getElementById("favoriteCount").textContent=items.filter(item=>item.favorite).length;
  document.getElementById("clearSearch").classList.toggle("show",!!searchInput.value);
  document.getElementById("emptyState").classList.toggle("show",result.length===0);
  grid.innerHTML=result.map(item=>{
    const url=isUrl(item.content)?item.content.trim():"";
    return `<article class="item" data-id="${escapeHtml(item.id)}">
      <div class="item-top"><span class="kind">${escapeHtml(item.kind)}</span><span class="item-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
      <button class="star ${item.favorite?"on":""}" type="button" ${item.history?"data-save-history":"data-star"} aria-label="${item.history?"즐겨찾기에 저장":item.favorite?"즐겨찾기 해제":"즐겨찾기 추가"}" title="${item.history?"즐겨찾기에 저장":"즐겨찾기"}">${item.favorite?"★":"☆"}</button>
      ${item.history?"":`<div class="menu"><button class="more" type="button" data-menu aria-label="항목 메뉴">•••</button><div class="menu-pop"><button type="button" data-edit>수정</button><button class="delete" type="button" data-delete>삭제</button></div></div>`}</div>
      <div class="content">${escapeHtml(item.content)}</div>
      <div class="item-foot"><button class="copy" type="button" data-copy>복사</button>${item.history?"":`<button class="edit-direct" type="button" data-edit>수정</button>`}${url?`<a class="open-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">링크 열기 ↗</a>`:""}<span class="usage">${item.count?item.count+"회 사용":"미사용"}</span></div>
    </article>`;
  }).join("");
}
function showToast(message){const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),1500)}
async function copyText(item,button){
  try{await navigator.clipboard.writeText(item.content)}catch(e){const area=document.createElement("textarea");area.value=item.content;area.style.cssText="position:fixed;opacity:0";document.body.appendChild(area);area.select();document.execCommand("copy");area.remove()}
  if(typeof window.wincoRecordCopy==="function")window.wincoRecordCopy(item.content);
  if(!item.history){item.count=Number(item.count||0)+1;item.copiedAt=Date.now();saveItems()}
  showToast("‘"+item.title+"’ 복사 완료");
  if(button){const old=button.textContent;button.textContent="복사됨 ✓";setTimeout(()=>{button.textContent=old;render()},850)}else render();
}
function openEditor(item){
  editingId=item?item.id:null;
  document.getElementById("dialogTitle").textContent=item?"항목 수정":"새 항목 추가";
  document.getElementById("kindInput").value=item?item.kind:"답변";
  document.getElementById("titleInput").value=item?item.title:"";
  document.getElementById("contentInput").value=item?item.content:"";
  document.getElementById("favoriteInput").checked=!!(item&&item.favorite);
  dialog.showModal();setTimeout(()=>document.getElementById("titleInput").focus(),50);
}
document.getElementById("tabs").addEventListener("click",event=>{const tab=event.target.closest("[data-filter]");if(!tab)return;activeFilter=tab.dataset.filter;document.querySelectorAll(".tab").forEach(node=>node.classList.toggle("active",node===tab));render()});
searchInput.addEventListener("input",render);
document.getElementById("clearSearch").addEventListener("click",()=>{searchInput.value="";render();searchInput.focus()});
document.getElementById("addButton").addEventListener("click",()=>openEditor(null));
document.getElementById("dialogClose").addEventListener("click",()=>dialog.close());
document.getElementById("cancelButton").addEventListener("click",()=>dialog.close());
form.addEventListener("submit",event=>{
  event.preventDefault();
  const title=document.getElementById("titleInput").value.trim();const content=document.getElementById("contentInput").value.trim();
  if(!title||!content){showToast("제목과 내용을 모두 입력해 주세요");return}
  if(editingId){const item=items.find(row=>row.id===editingId);if(item){item.kind=document.getElementById("kindInput").value;item.title=title;item.content=content;item.favorite=document.getElementById("favoriteInput").checked}}
  else items.unshift({id:makeId(),kind:document.getElementById("kindInput").value,title,content,favorite:document.getElementById("favoriteInput").checked,count:0,copiedAt:0});
  saveItems();dialog.close();render();showToast(editingId?"수정했습니다":"보관함에 추가했습니다");
});
grid.addEventListener("click",event=>{
  const card=event.target.closest("[data-id]");if(!card)return;const item=currentResult.find(row=>row.id===card.dataset.id);if(!item)return;
  if(event.target.closest("[data-menu]")){const menu=event.target.closest(".menu");document.querySelectorAll(".menu.open").forEach(node=>{if(node!==menu)node.classList.remove("open")});menu.classList.toggle("open");return}
  if(event.target.closest("[data-star]")){item.favorite=!item.favorite;saveItems();render();showToast(item.favorite?"즐겨찾기에 추가했습니다":"즐겨찾기에서 해제했습니다");return}
  if(event.target.closest("[data-save-history]")){const existing=items.find(row=>row.content.trim()===item.content.trim());if(existing)existing.favorite=true;else items.unshift({id:makeId(),kind:"기타",title:item.title||"저장한 복사 내용",content:item.content,favorite:true,count:0,copiedAt:item.copiedAt||0});saveItems();render();showToast("즐겨찾기에 저장했습니다");return}
  if(event.target.closest("[data-copy]")){copyText(item,event.target.closest("[data-copy]"));return}
  if(event.target.closest("[data-edit]")){openEditor(item);return}
  if(event.target.closest("[data-delete]")){if(confirm("‘"+item.title+"’ 항목을 삭제할까요?")){items=items.filter(row=>row.id!==item.id);saveItems();render();showToast("삭제했습니다")}return}
});
document.addEventListener("click",event=>{if(!event.target.closest(".menu"))document.querySelectorAll(".menu.open").forEach(node=>node.classList.remove("open"))});
render();
</script>
</body>
</html>
